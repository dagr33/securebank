
name: SecureBank CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  banking-api:
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: apps/banking-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: API health smoke test
        run: |
          python -m uvicorn app.main:app \
            --host 127.0.0.1 --port 8000 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/health \
              | grep -q '"status":"ok"'; then
              echo "Health check passed"
              exit 0
            fi
            sleep 1
          done

          echo "Health check failed"
          exit 1

      - name: Build Docker image
        run: docker build -t securebank-api:ci .

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: securebank-api:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"

       
      - name: Scan Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: securebank-api:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Security Gate - Block Fixable Vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: securebank-api:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
 
      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag securebank-api:ci ghcr.io/dagr33/securebank-api:${{ github.sha }}
          docker push ghcr.io/dagr33/securebank-api:${{ github.sha }}
